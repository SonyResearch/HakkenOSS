[project]
name = "query-interface"
version = "0.3.20"
description = "This is the REST service to expose the intelligent query package"
authors = [{ name = "Hakken Contributors" }]
requires-python = ">=3.11, <3.12"
readme = "README.md"

dependencies = [
    "complex-query==0.5.15",
    "simple-query==0.2.21"
]

[dependency-groups]
prebuild = [
    "black>=24.8.0,<25",
    "isort>=5.13.2,<6",
    "flake8>=7.1.1,<8",
    "pytest>=8.3.3,<9",
    "mypy>=1.11.2,<2",
]

[tool.uv]
package = false
default-groups = ["prebuild"]

[[tool.uv.index]]
name = "hakken-codeartifact-registry"
url = "https://<YOUR_REGISTRY_URL>/simple/"
authenticate = "always"


[tool.uv.sources]
complex-query = { index = "hakken-codeartifact-registry" }
simple-query = { index = "hakken-codeartifact-registry" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
files = ["service.py", "tests/**/*.py"]

[[tool.mypy.overrides]]
module = "complex_query.delivery.rest.router"
ignore_missing_imports = true

[tool.isort]
profile = "black"

[tool.black]
line-length = 100
extend-exclude = [".md", ".json"]
