[project]
name = "kge"
version = "0.3.1"
description = "KGE functionalities"
authors = [{ name = "Pablo Sanchez-Martin", email = "pablo.sanchez2@sony.com" }]
requires-python = ">=3.11, <3.12"
readme = "README.md"
dependencies = [
    "hydra-core>=1.3.2,<2",
    "omegaconf>=2.3.0,<3",
    "numpy>=2.2.0, <3",
    "python-dotenv>=1.0.1,<2",
    "torch>=2.4.0,<3",
    "pandas>=2.2.2,<3",
    "pydantic>=2.8.2,<3",
    "lightning>=2.4.0,<3",
    "pykeen>=1.10.2,<2",
    "hakken_ml_toolkit[aws,tracker]>=0.2.2",
    "datasets",
    "gnn",
    "click>=8.1.7,<9",
    "tqdm>=4.66.5,<5",
    "strenum>=0.4.15,<0.5",
    "torch-geometric>=2.6.1,<3",
    "loguru>=0.7.3",
    "diskcache>=5.6.3",
    "pyg-lib>=0.4.0; sys_platform == 'linux' or sys_platform == 'darwin'",
    "torch-sparse>=0.6.18; sys_platform == 'darwin'",
    "torch-scatter>=2.1.2; sys_platform == 'darwin'",
]

[project.scripts]
train = "kge.delivery.cli.train:main"
inference = "kge.delivery.cli.inference:main"

[dependency-groups]
prebuild = [
    "pytest>=8.2.2,<9",
    "mypy>=1.10.1,<2",
    "ruff>=0.13.1,<0.15",
]
dev = [
    "ipykernel>=6.29.5,<7",
    "mlflow>=2.15.1,<3",
    "pandas-stubs>=2.2.2.240807,<3",
    "types-pyyaml>=6.0.12.20240808,<7",
    "streamlit>=1.37.0,<2",
    "matplotlib>=3.9.1,<4",
    "seaborn>=0.13.2,<0.14",
    "hydra-optuna-sweeper>=1.2.0,<2",
    "types-tqdm>=4.66.0.20240417,<5",
    "types-networkx>=3.4.2.20250319,<4",
    "types-seaborn>=0.13.2.20250111,<0.14",
]

[tool.uv]
default-groups = [
    "prebuild",
    "dev",
]

index-strategy = "unsafe-best-match"
resolution-strategy = "highest"

# find-links = ["https://data.pyg.org/whl/torch-2.7.1+cu118.html"]

environments = [
    "sys_platform == 'darwin'", 
    "sys_platform == 'linux'",
]

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pyg"
url = "https://data.pyg.org/whl/torch-2.11.0+cpu.html"
explicit = true


[tool.uv.sources]
torch = [
  { index = "pytorch-gpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }
]

pyg-lib = [
  { url = "https://data.pyg.org/whl/torch-2.7.0%2Bcu118/pyg_lib-0.5.0+pt27cu118-cp311-cp311-linux_x86_64.whl", marker = "sys_platform == 'linux'" },
  { url = "https://data.pyg.org/whl/torch-2.11.0%2Bcpu/pyg_lib-0.6.0%2Bpt211-cp311-cp311-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin'" },
]
torch-sparse = [{ url = "https://data.pyg.org/whl/torch-2.11.0%2Bcpu/torch_sparse-0.6.18-cp311-cp311-macosx_11_0_universal2.whl", marker = "sys_platform == 'darwin'" }]
torch-scatter = [{ url = "https://data.pyg.org/whl/torch-2.11.0%2Bcpu/torch_scatter-2.1.2-cp311-cp311-macosx_10_9_universal2.whl", marker = "sys_platform == 'darwin'" }]

hakken_ml_toolkit = { workspace = true }
datasets = { workspace = true }
gnn = { workspace = true }

[tool.uv.overrides]
pyg-lib = { version = ">=0.5.0" }


[tool.hatch.build.targets.sdist]
include = ["kge"]

[tool.hatch.build.targets.wheel]
include = ["kge"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disable_error_code = ["union-attr", "misc", "method-assign"]
files = [
    "kge/**/*.py",
    "tests/**/*.py"
]

[[tool.mypy.overrides]]
module = "ml_base_structures.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ml_utils.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "metrics.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "datasets.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "losses.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tracker.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "torch_geometric.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
exclude = ["misc/", "misc/**/*"]


extend-exclude = [".md", ".json"]

# Make ruff compatible with black
respect-gitignore = true
force-exclude = true

[tool.ruff.lint]

select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (finds likely bugs)
    "C4",  # flake8-comprehensions
    "RET", # flake8-return (return statement checks)
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "ERA", # erad icate (commented out code)
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "TCH", # type-checking imports
    "TRY", # try-except style
]

ignore = ["PLR0913", "TC001", "TC002", "PLR2004"]

[tool.ruff.format]

# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

skip-magic-trailing-comma = false
line-ending = "auto"

[tool.semantic_release]
commit_parser = "conventional-monorepo"
commit_message = """\
chore(release): kge@{version}`

Automatically generated by python-semantic-release
"""
tag_format = "kge-v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "kge-"

[tool.semantic_release.branches.alpha]
# Matches branches with the prefixes 'feat/', 'fix/', or 'perf/'.
match = "^(feat|fix|perf)/.+"
prerelease = true
prerelease_token = "dev"