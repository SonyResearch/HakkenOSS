sweep:
  dir: outputs/hpo/${now:%Y-%m-%d}/${now:%H-%M-%S}
  subdir: ${hydra.job.num}
sweeper:
  _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
  sampler:
    _target_: optuna.samplers.TPESampler
    seed: 123
    consider_prior: true
    prior_weight: 1.0
    consider_magic_clip: true
    consider_endpoints: false
    n_startup_trials: 10
    n_ei_candidates: 24
    multivariate: false
    warn_independent_sampling: true
  direction: min
  study_name: ${run.project}
  n_trials: 20
  n_jobs: 4   
  search_space:
    optimizer:kwargs.lr: TODO
