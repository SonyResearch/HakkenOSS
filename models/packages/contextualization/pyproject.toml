[project]
name = "contextualization"
version = "0.3.2"
description = "Contextualization package. It receives a subgraph as input, and gives back literature reference along with summary."
authors = [{ name = "Jihun Choi", email = "jihun.a.choi@sony.com" }]
requires-python = ">=3.10,<3.13"
readme = "README.md"
dependencies = [
    "pymilvus[model]>=2.4.7,<3",
    "pydantic>=2.9.2,<3",
    "pydantic-settings>=2.8.0,<3",
    "numpy>=2.2.0,<3",
    "dependency-injector>=4.42.0,<5",
    "ml-dtypes>=0.5.0,<0.6",
    "psycopg[binary]>=3.2.3,<4",
    "transformers>=4.57.3,<5.0.0",
    "torch>=2.1.0,<3",
    "pandas[pyarrow]>=2.2.3,<3",
    "einops>=0.8.1,<0.9",
    "scipy>=1.15.2,<2",
    "omegaconf>=2.3.0,<3",
    "backports-strenum>=1.3.1",
    "loguru>=0.7.3",
    "fastapi",
    "pyyaml>=6.0.2",
    "spaice-inference-api>=0.0.8",
    "datasets>=4.1.1",
]

[project.scripts]
encode = "contextualization.delivery.encode:main"

[dependency-groups]
prebuild = [
    "mypy>=1.11.2,<2",
    "pytest>=8.3.3,<9",
    "ruff>=0.13.1, <0.15",
    "types-pyyaml>=6.0.12.20241230,<7",
    "pandas-stubs>=2.2.2.240909,<3",
    "types-tqdm>=4.67.0.20241221,<5",
    "scipy-stubs>=1.15.2.0,<2",
]
dev = [
    "jupyterlab>=4.4.7",
    "python-dotenv>=1.0.1,<2",
]

[tool.uv]
default-groups = [
    "prebuild",
    "dev",
]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
    "sys_platform == 'any'",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-gpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }
]

spaice-inference-api = { workspace = true }
datasets = { workspace = true }


[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
explicit = true

[tool.hatch.build.targets.sdist]
include = ["contextualization"]

[tool.hatch.build.targets.wheel]
include = ["contextualization"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "postgres: marks tests which use PostgreSQL connection (deselected by default)",
    "milvus: marks tests which use Milvus connection (deselcted by default)"
]
addopts = [
    "-m not postgres and not milvus"
]

[tool.mypy]
explicit_package_bases = true
check_untyped_defs = true
warn_unused_configs = true
disable_error_code = ["union-attr", "misc"]
files = [
    "contextualization/**/*.py",
    "tests/**/*.py"
]

[[tool.mypy.overrides]]
module = "transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pymilvus.*"
ignore_missing_imports = true


# Ruff
[tool.ruff]
line-length = 100
extend-exclude = [".md", ".json"]

# Make ruff compatible with black
respect-gitignore = true
force-exclude = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (finds likely bugs)
    "C4",  # flake8-comprehensions
    "RET", # flake8-return (return statement checks)
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "ERA", # erad icate (commented out code)
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "TC",  # type-checking imports
] 

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.flake8-type-checking]
quote-annotations = true
exempt-modules = ["typing", "typing_extensions"]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]
runtime-evaluated-decorators = [
    "fastapi.APIRouter.post",
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
    "PLR2004",  # Allow magic values in tests
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

skip-magic-trailing-comma = false
line-ending = "auto"

[tool.semantic_release]
commit_parser = "conventional-monorepo"
commit_message = """\
chore(release): contextualization@{version}`

Automatically generated by python-semantic-release
"""
tag_format = "contextualization-v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "contextualization-"

[tool.semantic_release.branches.alpha]
# Matches branches with the prefixes 'feat/', 'fix/', or 'perf/'.
match = "^(feat|fix|perf)/.+"
prerelease = true
prerelease_token = "dev"