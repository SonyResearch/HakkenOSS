[project]
name = "filtering"
version = "0.3.7"
description = "Filtering module. Given candidate triplets, it filters out some of them and attaches filter scores to them."
authors = [{ name = "Jihun Choi", email = "jihun.a.choi@sony.com" }]
requires-python = ">=3.10, <3.13"
readme = "README.md"
dependencies = [
    "dependency-injector[yaml]>=4.44.0,<5",
    "pydantic>=2.10.0,<3",
    "pydantic-settings>=2.3.3,<3",
    "numpy>=2.2.0,<3",
    "networkx>=3.3,<3.6",
    "pandas>=2.2.2,<3",
    "overrides>=7.7.0,<8",
    "backports-strenum>=1.3.1 ; python_full_version < '3.11'",
    "loguru>=0.7.3",
    "spaice-inference-api>=0.0.8",
    "neo4j>=6.0.2",
]

[project.scripts]
benchmark-degree-cache = "filtering.delivery.benchmark.degree_cache:main"
benchmark-networkx = "filtering.delivery.benchmark.networkx:main"
benchmark-neo4j = "filtering.delivery.benchmark.neo4j:main"

[dependency-groups]
prebuild = [
    "mypy>=1.9.0,<2",
    "pytest>=8.1.1,<9",
    "ruff>=0.13.1,<0.15",
    "types-pyyaml>=6.0.12.20250915",
    "types-networkx>=3.2.1.20240618,<4",
    "pandas-stubs>=2.2.2.240603,<3",
    "types-tqdm>=4.66.0.20240417,<5",
]
dev = [
    "tqdm>=4.66.4,<5",
    "ipython>=8.26.0,<9",
    "psutil>=5,<6",
    "types-psutil>=6.1.0.20241221,<7",
    "python-dotenv>=1.0.1,<2",
]

[tool.uv]
default-groups = [
    "prebuild",
    "dev",
]

[tool.uv.sources]
spaice-inference-api = { workspace = true }

[tool.hatch.build.targets.sdist]
include = ["filtering"]

[tool.hatch.build.targets.wheel]
include = ["filtering"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "neo4j: marks tests which use real neo4j connection",
]
addopts = [
    "-m not neo4j"
]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
files = ["filtering", "tests"]

[[tool.mypy.overrides]]
module = "neo4j.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
extend-exclude = [".md", ".json"]

# Make ruff compatible with black
respect-gitignore = true
force-exclude = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (finds likely bugs)
    "C4",  # flake8-comprehensions
    "RET", # flake8-return (return statement checks)
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "ERA", # erad icate (commented out code)
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "TC",  # type checking block rules
] 

[tool.ruff.lint.flake8-type-checking]
quote-annotations = true
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
    "PLR2004",  # Allow magic values in tests
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

skip-magic-trailing-comma = false
line-ending = "auto"

[tool.semantic_release]
commit_parser = "conventional-monorepo"
commit_message = """\
chore(release): filtering@{version}`

Automatically generated by python-semantic-release
"""
tag_format = "filtering-v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "filtering-"

[tool.semantic_release.branches.alpha]
# Matches branches with the prefixes 'feat/', 'fix/', or 'perf/'.
match = "^(feat|fix|perf)/.+"
prerelease = true
prerelease_token = "dev"