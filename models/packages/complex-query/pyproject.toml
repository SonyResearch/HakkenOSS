[project]
name = "complex-query"
version = "0.5.15"
description = "Package for answering complex queries on Knowledge Graphs. Complex queries are parsed and decomposed into atomic conditions. The package interfaces with knowledge graphs for data retrieval and neural link predictors to predict the truth values of atoms. Search routines help to navigate the decomposition towards a general solution."
authors = [
    { name = "Samy Badreddine", email = "samy.badreddine@sony.com" },
    { name = "Jihun Choi", email = "jihun.a.choi@sony.com" },
]
requires-python = ">=3.10, <3.13"
readme = "README.md"
dependencies = [
    "query-common==0.3.2",
    "spaice-inference-api>=0.0.8",
    "filtering>=0.3.7",
    "pyparsing>=3.1.1,<4",
    "networkx~=3.2",
    "numpy>=2.2.0,<3",
    "pydantic~=2.7",
    "pyyaml>=6.0.0,<7",
    "tqdm>=4.66.4,<5",
    "pandas>=2.2.2,<3",
    "h5py>=3.11.0,<4",
    "loguru>=0.7.3",
    "backports-strenum>=1.3.1 ; python_full_version < '3.11'",
    "neo4j>=6.0.2",
]

[dependency-groups]
prebuild = [
    "mypy>=1.6.1,<2",
    "pytest>=8.3.3,<9",
    "pandas-stubs>=2.2.3,<3",
    "tqdm-stubs>=0.2.1,<0.3",
    "types-requests>=2.32.0,<3",
    "types-networkx>=3.4.2.20241227,<4",
    "ruff>=0.13.1,<0.15",
]
playground = [
    "gradio>=5.49.1,<6.0.0",
    "pydantic-yaml>=1.4.0,<2",
]
dev = [
    "python-dotenv>=1.0.1,<2",
    "responses>=0.25.8",
]

[tool.uv]
default-groups = [
    "prebuild",
    "playground",
    "dev",
]

[[tool.uv.index]]
name = "hakken-codeartifact-registry"
url = "https://your-private-registry.example.com/pypi/simple/"

[tool.uv.sources]
spaice-inference-api = { workspace = true }
filtering = { workspace = true }
query-common = { workspace = true }

[tool.hatch.build.targets.sdist]
include = ["complex_query"]

[tool.hatch.build.targets.wheel]
include = ["complex_query"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "neo4j: marks tests which use real neo4j connection (deselected by default)",
    "link_predictor_api: marks tests which use real link predictor API connection (deselected by default)"
]
addopts = [
    "-m not neo4j and not link_predictor_api",
    "--import-mode=importlib",
]
log_cli = true
log_cli_level = "INFO"

[tool.isort]
profile = "black"
extend_skip = [".md", ".json"]
multi_line_output = 3
force_grid_wrap = 0

[tool.black]
line_length = 100

[tool.mypy]
files = ["complex_query", "tests", "playground/gradio_demo"]
warn_unused_configs = true
disable_error_code = ["union-attr", "misc"]

[[tool.mypy.overrides]]
module = "neo4j.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "h5py.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "gradio.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
extend-exclude = [".md", ".json"]

# Make ruff compatible with black
respect-gitignore = true
force-exclude = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (finds likely bugs)
    "C4",  # flake8-comprehensions
    "RET", # flake8-return (return statement checks)
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "ERA", # erad icate (commented out code)
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "TC",  # type-checking imports
] 

[tool.ruff.lint.flake8-type-checking]
exempt-modules = ["typing", "typing_extensions"]
quote-annotations = true
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]
runtime-evaluated-decorators = [
    "fastapi.APIRouter.post",
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
    "PLR2004",  # Allow magic values in tests
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

skip-magic-trailing-comma = false
line-ending = "auto"

[tool.semantic_release]
commit_parser = "conventional-monorepo"
commit_message = """\
chore(release): complex-query@{version}`

Automatically generated by python-semantic-release
"""
tag_format = "complex-query-v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "complex-query-"

[tool.semantic_release.branches.alpha]
# Matches branches with the prefixes 'feat/', 'fix/', or 'perf/'.
match = "^(feat|fix|perf)/.+"
prerelease = true
prerelease_token = "dev"