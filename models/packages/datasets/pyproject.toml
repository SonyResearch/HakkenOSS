[project]
name = "datasets"
version = "0.1.9"
description = "Datasets"
authors = [{ name = "Pablo Sanchez-Martin", email = "pablo.sanchez2@sony.com" }]
requires-python = ">=3.11, <3.12"
readme = "README.md"
dependencies = [
    "numpy>=2.2.0,<3",
    "torch>=2.4.0,<3",
    "omegaconf>=2.3.0,<3",
    "hakken_ml_toolkit[aws]",
    "pandas>=2.2.2,<3",
    "pykeen>=1.10.2,<2",
    "python-dotenv>=1.0.1,<2",
    "torch-geometric>=2.6.1,<3",
    "strenum>=0.4.15,<0.5",
    "pydantic>=2.10.4,<3",
    "loguru>=0.7.3",
    "polars[gpu]>=1.31.0 ; sys_platform == 'linux'",
    "polars>=1.31.0 ; sys_platform == 'darwin'",
    "pip>=26.0.1",
]

[dependency-groups]
prebuild = [
    "pytest>=8.2.2,<9",
    "mypy>=1.17,<1.18",
    "ruff>=0.13.1,<0.15",
]
dev = [
    "ipykernel>=6.29.5,<7",
    "pandas-stubs>=2.2.2.240909,<3",
]

[tool.uv]
default-groups = [
    "prebuild",
    "dev",
]
index-strategy = "unsafe-best-match"

environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


[tool.uv.sources]
torch = [
  { index = "pytorch-gpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]
hakken_ml_toolkit = { workspace = true }

[tool.hatch.build.targets.sdist]
include = ["datasets"]

[tool.hatch.build.targets.wheel]
include = ["datasets"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
files = [
    "datasets/**/*.py",
    "tests/**/*.py"
]

[tool.ruff]
line-length = 100

extend-exclude = [".md", ".json", "playground/**"]

# Make ruff compatible with black
respect-gitignore = true
force-exclude = true

[tool.ruff.lint]

select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (finds likely bugs)
    "C4",  # flake8-comprehensions
    "RET", # flake8-return (return statement checks)
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "ERA", # erad icate (commented out code)
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "TCH", # type-checking imports
    "TRY", # try-except style
]

ignore = ["B008", "PLR2004", "C408"]

[tool.ruff.format]

# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

skip-magic-trailing-comma = false
line-ending = "auto"

[tool.semantic_release]
commit_parser = "conventional-monorepo"
commit_message = """\
chore(release): datasets@{version}`

Automatically generated by python-semantic-release
"""
tag_format = "datasets-v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "datasets-"

[tool.semantic_release.branches.alpha]
# Matches branches with the prefixes 'feat/', 'fix/', or 'perf/'.
match = "^(feat|fix|perf)/.+"
prerelease = true
prerelease_token = "dev"