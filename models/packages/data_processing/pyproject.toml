[project]
name = "data-processing"
version = "1.1.0"
description = "A repo that takes care to process raw data into a clean format and version."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "boto3>=1.3",
    "boto3-stubs[essential]>=1.40.64",
    "dask[complete]>=2025.5.1",
    "hydra-core>=1.3.2",
    "loguru>=0.7.3",
    "neo4j>=6.0.2",
    "networkx>=3.5",
    "nltk>=3.9.1",
    "pandas>=2.3.0",
    "pandas-stubs>=2.3.2.250926",
    "polars>=1.38.1",  # Matches hakken-agents requirement
    "polars[gpu]>=1.38.1; sys_platform == 'linux'", # Only try GPU on Linux    "cudf-cu12==26.4.0; sys_platform == 'linux'",
    "pylibcudf-cu12==26.4.0; sys_platform == 'linux'",   
    "pydantic>=2.11.7",
    "pydantic-settings>=2.11.0",
    "requests>=2.32.4",
    "s3fs>=2024, <2026",
    "setuptools>=80.9.0",
    "tqdm>=4.67.1",
    "types-networkx>=3.5.0.20251106",
    "types-requests>=2.32.4.20250913",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.22",
    "mkdocstrings>=0.30.1",
]

neo4j = ["neo4j>=6.0.2"]

spark = [
    "pyspark>=4.0.0",
]
dev = [
    "ipykernel>=6.29.5,<7",
]

[dependency-groups]
dev = [
    "mypy>=1.16.1",
    "pytest>=8.4.1",
    "ruff>=0.12.1",
]
prebuild = [
    "boto3-stubs>=1.40.64",
    "types-networkx>=3.5.0.20251106",
]

[tool.uv]
default-groups = [
    "prebuild",
    "dev",
]
index-strategy = "unsafe-best-match"
find-links = ["https://data.pyg.org/whl/torch-2.7.1+cu118.html"]

required-environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'"
]


[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true


[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


[tool.uv.sources]
torch = [
  { index = "pytorch-gpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }
]

[tool.hatch.build.targets.sdist]
include = ["data_processing"]

[tool.hatch.build.targets.wheel]
include = ["data_processing"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
files = [
    "data_processing/**/*.py",
    "tests/**/*.py"
]
exclude = [
    "^misc/"
]

[tool.ruff]
line-length = 100

# Make ruff compatible with black
respect-gitignore = true
force-exclude = true

exclude = [
    "misc"
]

[tool.ruff.lint]

select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (finds likely bugs)
    "C4",  # flake8-comprehensions
    "RET", # flake8-return (return statement checks)
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "ERA", # erad icate (commented out code)
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "TCH", # type-checking imports
    "TRY", # try-except style
]

ignore = ["PLR0913", "TC001", "TC002", "PLR2004"]


[tool.ruff.format]

# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

skip-magic-trailing-comma = false
line-ending = "auto"

[tool.semantic_release]
commit_parser = "conventional-monorepo"
commit_message = """\
chore(release): data_processing@{version}`

Automatically generated by python-semantic-release
"""
tag_format = "data_processing-v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "data_processing-"

[tool.semantic_release.branches.alpha]
# Matches branches with the prefixes 'feat/', 'fix/', or 'perf/'.
match = "^(feat|fix|perf)/.+"
prerelease = true
prerelease_token = "dev"