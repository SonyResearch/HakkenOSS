[project]
name = "embeddings"
version = "0.1.2"
description = "RDF2Vec Embedding Method. It receives an input graph, a set of entities and creates embeddings. "
authors = [{ name = "Susana Nunes", email = "susana.placidonunes@sony.com" }]
requires-python = ">=3.11, <3.12"
readme = "README.md"
dependencies = [
    "rdflib>=7.0.0,<8",
    "gensim==4.3.2",
    "scikit-learn>=1.3.1",
    "sparqlwrapper==2.0.0",
    "aiohttp==3.8.5",
    "tqdm>=4.66.4,<5",
    "nest-asyncio==1.5.8",
    "networkx~=3.3",
    "black<24",
    "pydantic>=2.6.4,<3",
    "pydantic-settings>=2.2.1,<3",
    "cachetools>=5.3.3,<6",
    "requests>=2.31.0,<3",
    "scipy>=1.15.2,<2",
    "dependency-injector[yaml]>=4.46.0,<5",
]

[project.scripts]
embeddings = "embeddings.delivery.cli.run_embeddings:main"

[dependency-groups]
prebuild = [
    "isort>=5.13.2,<6",
    "flake8>=7.0.0,<8",
    "mypy>=1.9.0,<2",
    "pytest>=8.1.1,<9",
]

[tool.uv]
default-groups = ["prebuild"]

[tool.hatch.build.targets.sdist]
include = [
    "embeddings",
    "pyrdf2vec/**/*.py",
]

[tool.hatch.build.targets.wheel]
include = [
    "embeddings",
    "pyrdf2vec/**/*.py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
files = ["embeddings/**/*.py", "tests/**/*.py"]

[[tool.mypy.overrides]]
module = ["pyrdf2vec.*"]
ignore_errors=true

[tool.isort]
profile = "black"

[tool.black]
line_length = 100
extend_skip = [".md", ".json"]
multi_line_output=3
force_grid_wrap = 0


[tool.semantic_release]
commit_parser = "conventional-monorepo"
commit_message = """\
chore(release): embeddings@{version}`

Automatically generated by python-semantic-release
"""
tag_format = "embeddings-v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "embeddings-"

[tool.semantic_release.branches.alpha]
# Matches branches with the prefixes 'feat/', 'fix/', or 'perf/'.
match = "^(feat|fix|perf)/.+"
prerelease = true
prerelease_token = "dev"