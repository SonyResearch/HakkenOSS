[project]
name = "kge_api"
version = "0.2.4"
description = "KGE API functionalities"
authors = [{ name = "Pablo Sanchez-Martin", email = "pablo.sanchez2@sony.com" }]
requires-python = ">=3.11, <3.13"
readme = "README.md"
dependencies = [
    "torch>=2.4.0,<3",
    "torchaudio>=2.6.0,<3",
    "hakken_ml_toolkit[aws,tracker]==0.2.4",
    "datasets==0.1.8",
    "gnn==0.1.5",
    "kge==0.3.1",
    "optuna-integration[pytorch-lightning]>=4.4.0",
    "spaice-inference-api==0.0.3",
]

[dependency-groups]
prebuild = [
    "pytest>=8.2.2,<9",
    "mypy>=1.10.1,<2",
    "ruff>=0.13.1,<0.15",
]

dev = ["ipykernel>=6.29.5,<7"]

[tool.uv]
default-groups = [
    "prebuild",
    "dev",
]
index-strategy = "unsafe-best-match"

find-links = ["https://data.pyg.org/whl/torch-2.7.1+cu118.html"]

environments = [
    "sys_platform == 'darwin'", # and platform_machine == 'arm64'",
    "sys_platform == 'linux'", # and platform_machine == 'x86_64'"
    "sys_platform == 'any'", # and platform_machine == 'x86_64'"
]


[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[[tool.uv.index]]
name = "hakken-codeartifact-registry"
url = "https://your-private-registry.example.com/pypi/simple/"
explicit = true
authenticate = "always"

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-gpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }
]

torchaudio = [
  { index = "pytorch-gpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }
]
hakken_ml_toolkit = { workspace = true }
datasets = { workspace = true }
gnn = { workspace = true }
kge = { workspace = true }
spaice-inference-api = { workspace = true }



[tool.hatch.build.targets.sdist]
include = ["kge_api"]

[tool.hatch.build.targets.wheel]
include = ["kge_api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
files = [
    "kge_api/**/*.py",
    "tests/**/*.py"
]

[tool.ruff]
line-length = 100

extend-exclude = [".md", ".json", "misc"]

# Make ruff compatible with black
respect-gitignore = true
force-exclude = true

[tool.ruff.lint]

select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (finds likely bugs)
    "C4",  # flake8-comprehensions
    "RET", # flake8-return (return statement checks)
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "ERA", # erad icate (commented out code)
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "TCH", # type-checking imports
    "TRY", # try-except style
]

ignore = ["B008"]

[tool.ruff.format]

# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

skip-magic-trailing-comma = false
line-ending = "auto"

[tool.semantic_release]
commit_parser = "conventional-monorepo"
commit_message = """\
chore(release): kge-api@{version}`

Automatically generated by python-semantic-release
"""
tag_format = "kge-api-v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "kge-api-"

[tool.semantic_release.branches.alpha]
# Matches branches with the prefixes 'feat/', 'fix/', or 'perf/'.
match = "^(feat|fix|perf)/.+"
prerelease = true
prerelease_token = "dev"