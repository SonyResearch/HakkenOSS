[project]
name = "hakken-utils"
version = "0.1.2"
description = ""
authors = [{ name = "Alessandra Toniato", email = "alessandra.toniato@sony.com" }]
requires-python = ">=3.11, <3.12"
readme = "README.md"
dependencies = ["logfmter>=0.0.8,<0.0.9"]

[dependency-groups]
prebuild = [
    "mypy>=1.14.1,<2",
    "pytest>=8.3.4,<9",
    "ruff>=0.13.1,<0.15",
]

[tool.uv]
default-groups = ["prebuild"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.isort]
profile = "black"

[tool.black]
line_length = 100
extend_skip = [".md", ".json"]
multi_line_output=3
force_grid_wrap = 0

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
files = ["hakken_utils/**/*.py", "tests/**/*.py"]

[tool.ruff]
line-length = 100
extend-exclude = [".md", ".json"]

# Make ruff compatible with black
respect-gitignore = true
force-exclude = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (finds likely bugs)
    "C4",  # flake8-comprehensions
    "RET", # flake8-return (return statement checks)
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "ERA", # erad icate (commented out code)
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "TC",  # type-checking imports
]

[tool.ruff.lint.flake8-type-checking]
quote-annotations = true
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]
runtime-evaluated-decorators = [
    "fastapi.APIRouter.post",
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
    "PLR2004",  # Allow magic values in tests
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

skip-magic-trailing-comma = false
line-ending = "auto"


[tool.semantic_release]
commit_parser = "conventional-monorepo"
commit_message = """\
chore(release): hakken-utils@{version}`

Automatically generated by python-semantic-release
"""
tag_format = "hakken-utils-v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "hakken-utils-"

[tool.semantic_release.branches.alpha]
# Matches branches with the prefixes 'feat/', 'fix/', or 'perf/'.
match = "^(feat|fix|perf)/.+"
prerelease = true
prerelease_token = "dev"