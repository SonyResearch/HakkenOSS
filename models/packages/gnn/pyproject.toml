[project]
name = "gnn"
version = "0.1.5"
description = "GNN functionalities"
authors = [{ name = "Pablo Sanchez-Martin", email = "pablo.sanchez2@sony.com" }]
requires-python = ">=3.11, <3.12"
readme = "README.md"
dependencies = [
    "hydra-core>=1.3.2,<2",
    "omegaconf>=2.3.0,<3",
    "numpy>=2.2.0,<3",
    "python-dotenv>=1.0.1,<2",
    "torch>=2.4.0,<3",
    "pandas>=2.2.2,<3",
    "pydantic>=2.8.2,<3",
    "hakken_ml_toolkit[aws,tracker]",
    "datasets",
    "torch-geometric>=2.6.1,<3",
    "strenum>=0.4.15,<0.5",
]

[dependency-groups]
prebuild = [
    "pytest>=8.2.2,<9",
    "mypy>=1.10.1,<2",
    "ruff>=0.13.1,<0.15",
]
dev = [
    "ipykernel>=6.29.5,<7",
    "mlflow>=2.15.1,<3",
    "pandas-stubs>=2.2.2.240807,<3",
    "types-pyyaml>=6.0.12.20240808,<7",
    "streamlit>=1.37.0,<2",
    "matplotlib>=3.9.1,<4",
    "seaborn>=0.13.2,<0.14",
    "hydra-optuna-sweeper>=1.2.0,<2",
    "types-tqdm>=4.66.0.20240417,<5",
]

[tool.uv]
default-groups = [
    "prebuild",
    "dev",
]
index-strategy = "unsafe-best-match"


[[tool.uv.index]]
url = "https://pypi.nvidia.com/pylibcudf-cu11"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "cudnn-cu11"
url = "https://pypi.org/simple/nvidia-cudnn-cu11/"

[[tool.uv.index]]
name = "cudf-cu11"
url = "https://pypi.org/simple/cudf-cu11/"


[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

# [[tool.uv.index]]
# name = "pyg-gpu"
# url = "https://data.pyg.org/whl/torch-2.4.1+cu118.html"
# explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-gpu", marker = "sys_platform == 'linux'" },
]
datasets = { workspace = true }
# nvidia-cudnn-cu11 = [
#   { index = "cudnn-cu11"},
# ]
# cudf-cu11 = [
#   { index = "cudf-cu11"},
# ]

hakken_ml_toolkit = { workspace = true }

[tool.hatch.build.targets.sdist]
include = ["gnn"]

[tool.hatch.build.targets.wheel]
include = ["gnn"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
files = [
    "gnn/**/*.py",
    "tests/**/*.py"
]

[[tool.mypy.overrides]]
module = "ml_base_structures.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ml_utils.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "torch_geometric.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100

extend-exclude = [".md", ".json", "playground/**"]

# Make ruff compatible with black
respect-gitignore = true
force-exclude = true

[tool.ruff.lint]

select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (finds likely bugs)
    "C4",  # flake8-comprehensions
    "RET", # flake8-return (return statement checks)
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "ERA", # erad icate (commented out code)
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "TCH", # type-checking imports
    "TRY", # try-except style
]

ignore = ["B008", "PLR2004", "PLR0913", "TC002"]

[tool.ruff.format]

# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

skip-magic-trailing-comma = false
line-ending = "auto"

[tool.semantic_release]
commit_parser = "conventional-monorepo"
commit_message = """\
chore(release): gnn@{version}`

Automatically generated by python-semantic-release
"""
tag_format = "gnn-v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "gnn-"

[tool.semantic_release.branches.alpha]
# Matches branches with the prefixes 'feat/', 'fix/', or 'perf/'.
match = "^(feat|fix|perf)/.+"
prerelease = true
prerelease_token = "dev"