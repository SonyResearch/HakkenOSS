[project]
name = "hypgen-pipeline"
version = "0.1.2"
description = ""
authors = [{ name = "Alessandra Toniato", email = "alessandra.toniato@sony.com" }]
requires-python = ">=3.10, <3.12"
readme = "README.md"
dependencies = [
    "pandas>=2.2.3,<3",
    "pyyaml>=6.0.2,<7",
    "pandas-stubs>=2.2.3.241126,<3",
    "types-pyyaml>=6.0.12.20241230,<7",
    "pydantic>=2.10.6,<3",
    "networkx>=3.4.2,<4",
    "tqdm>=4.67.1,<5",
    "types-networkx>=3.4.2.20250319,<4",
    "types-tqdm>=4.67.0.20250404,<5",
    "python-dotenv>=1.1.0,<2",
    "hakken_ml_toolkit>=0.2.4,<0.3",
]

[project.scripts]
prepare = "hypgen_pipeline.delivery.cli.prepare:main"
filter-topk-entities = "hypgen_pipeline.delivery.cli.filter_topk_entities:main"
filter-by-path-length = "hypgen_pipeline.delivery.cli.filter_by_path_length:main"
filter-by-recency = "hypgen_pipeline.delivery.cli.filter_by_recency:main"
finalize = "hypgen_pipeline.delivery.cli.finalize:main"

[dependency-groups]
prebuild = [
    "mypy>=1.15.0,<2",
    "pytest>=8.3.4,<9",
    "ruff>=0.13.1,<0.15",
]

[tool.uv]
default-groups = ["prebuild"]

[[tool.uv.index]]
name = "hakken-codeartifact-registry"
url = "https://your-private-registry.example.com/pypi/simple/"

[tool.uv.sources]
hakken-ml-toolkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
files = ["hypgen_pipeline/**/*.py", "tests/**/*.py"]

[tool.ruff]
line-length = 100

extend-exclude = [".md", ".json"]

# Make ruff compatible with black
respect-gitignore = true
force-exclude = true

[tool.ruff.lint]

select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (finds likely bugs)
    "C4",  # flake8-comprehensions
    "RET", # flake8-return (return statement checks)
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "ERA", # erad icate (commented out code)
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "TCH", # type-checking imports
    "TRY", # try-except style
]

ignore = ["B008", "PLR2004"]

[tool.ruff.format]

# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

skip-magic-trailing-comma = false
line-ending = "auto"

[tool.semantic_release]
commit_parser = "conventional-monorepo"
commit_message = """\
chore(release): hypgen-pipeline@{version}`

Automatically generated by python-semantic-release
"""
tag_format = "hypgen-pipeline-v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "hypgen-pipeline-"

[tool.semantic_release.branches.alpha]
# Matches branches with the prefixes 'feat/', 'fix/', or 'perf/'.
match = "^(feat|fix|perf)/.+"
prerelease = true
prerelease_token = "dev"