[project]
name = "hakken-agents"
version = "0.3.0"
description = "Hakken AI Agents"
authors = [{ name = "Pablo Sanchez-Martin", email = "pablo.sanchez2@sony.com" }]
requires-python = ">=3.11, <3.12"
readme = "README.md"
dependencies = [
    "diskcache>=5.6.3",
    "langchain-community>=0.4.1",
    "langchain-ollama>=1.0.1",
    "mineru[core]>=3",
    "pip>=26.0",
    "polars>=1.38.1",
]


[dependency-groups]
prebuild = [
    "pytest>=8.2.2,<9",
    "mypy>=1.10.1,<2",
    "ruff>=0.13.1,<0.15",
    "testcontainers[postgresql]>=4.14.1",
]
dev = [
    "ipykernel>=6.29.5,<7",
    "pandas-stubs>=2.2.2.240807,<3",
    "types-networkx>=3.6.1.20251212",
    "types-pyyaml>=6.0.12.20240808,<7",
    "types-tqdm>=4.66.0.20240417,<5",
]

docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

graph-builder = [
    "asyncpg>=0.31.0",
    "hydra-core>=1.3.2",
    "jinja2>=3.1.6",
    "langchain>=1.2.7",
    "langchain-openai>=1.1.7",
    "langchain-postgres>=0.0.16",
    "langchain-text-splitters>=1.1.0",
    "langgraph>=1.0.7",
    "loguru>=0.7.3",
    "numpy>=2.2.0,<3",
    "omegaconf>=2.3.0",
    "pandas>=2.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.2.1",
    "strenum>=0.4.15",
    "typer>=0.21.1",
]

[tool.uv]
default-groups = [
    "prebuild",
    "dev",
    "docs",
    "graph-builder",
    "api",
]
index-strategy = "unsafe-best-match"



[tool.uv.sources]
graphiti-core = { path = "../graphiti", editable = true }




[tool.hatch.build.targets.sdist]
include = ["hakken_agents"]

[tool.hatch.build.targets.wheel]
include = ["hakken_agents"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
# 1. Type-check function bodies even if signatures are missing
check_untyped_defs = true

# 2. Require all functions to have full type annotations
disallow_untyped_defs = true

# 3. Prevent implicit Optional (forces explicit Optional[T])
no_implicit_optional = true

# 4. Show error codes like [arg-type], [return-value], etc.
show_error_codes = true

# 5. Don’t explode on third-party libraries without type stubs
ignore_missing_imports = true

files = [
    "hakken_agents/**/*.py"
    ]



[tool.ruff]
line-length = 100
exclude = ["misc/", "misc/**/*", "tests/", "scripts/manage_db.py", "notebooks/", "hakken_agents/utils/rag_anything/", "hakken_agents/utils/lightrag/"]


extend-exclude = [".md", ".json"]

# Make ruff compatible with black
respect-gitignore = true
force-exclude = true

[tool.ruff.lint]

select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (finds likely bugs)
    "C4",  # flake8-comprehensions
    "RET", # flake8-return (return statement checks)
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "ERA", # erad icate (commented out code)
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "TCH", # type-checking imports
    "TRY", # try-except style
]

ignore = ["PLR0913", "TC001", "TC002", "PLR2004", "TRY003", "PLR0915"]

[tool.ruff.format]

# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

skip-magic-trailing-comma = false
line-ending = "auto"

[tool.semantic_release]
commit_parser = "conventional-monorepo"
commit_message = """\
chore(release): hakken-agents@{version}`

Automatically generated by python-semantic-release
"""
tag_format = "hakken-agents-v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "hakken-agents-"

[tool.semantic_release.branches.alpha]
# Matches branches with the prefixes 'feat/', 'fix/', or 'perf/'.
match = "^(feat|fix|perf)/.+"
prerelease = true
prerelease_token = "dev"