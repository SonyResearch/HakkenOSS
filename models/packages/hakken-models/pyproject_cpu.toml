[project]
name = "hakken-models"
version = "0.3.0"
description = "Hakken Predictive Models"
authors = [{ name = "Pablo Sanchez-Martin", email = "pablo.sanchez2@sony.com" }]
requires-python = ">=3.11, <3.12"
readme = "README.md"
dependencies = [
    "numpy>=2.2.0, <3",
    "python-dotenv>=1.0.1,<2",
    "torch>=2.4.0,<3",
    "pandas>=2.2.2,<3",
    "pydantic>=2.8.2,<3",
    "tqdm>=4.66.5,<5",
    "strenum>=0.4.15,<0.5",
    "loguru>=0.7.3",
    "zenml[connectors-aws,connectors-kubernetes,local,server,mlflow]==0.93.0",
    "pydantic-settings>=2.12.0",
    "pip>=25.3",
    "polars>=1.35.2",
    "s3fs>=2024, <2026",
    "evidently>=0.7.16",
    "lightning>=2.5.6",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.2",
    "hakken_ml_toolkit>=0.2.4",
    "torch-geometric>=2.7.0",
    "pyg-lib",
    "mlflow[extras]>=2.15.1,<3",
    "zenml==0.93.0",
]


[dependency-groups]
prebuild = [
    "pytest>=8.2.2,<9",
    "mypy>=1.10.1,<2",
    "ruff>=0.9.1,<0.10",
]
dev = [
    "ipykernel>=6.29.5,<7",
    "pandas-stubs>=2.2.2.240807,<3",
    "types-networkx>=3.6.1.20251212",
    "types-pyyaml>=6.0.12.20240808,<7",
    "types-tqdm>=4.66.0.20240417,<5",
]

[tool.uv]
default-groups = [
    "prebuild",
    "dev",
]

index-strategy = "unsafe-best-match"

environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
    "sys_platform == 'any'",
]


find-links = ["https://data.pyg.org/whl/nightly/torch-2.7.0+cu118.html"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[[tool.uv.index]]
name = "pyg"
url = "https://data.pyg.org/whl/torch-2.7.0+cpu.html"
explicit = true

[[tool.uv.index]]
name = "hakken-pip-registry"
url = "https://your-private-registry.example.com/pypi/simple/"
explicit = true
authenticate = "always"

[tool.uv.sources]
# Pin torch to specific indexes based on the platform
# hakken_ml_toolkit = [
#     { path = "../hakken_ml_toolkit", marker = "sys_platform == 'darwin'", editable = true },
#     { index = "hakken-pip-registry", marker = "sys_platform == 'any'" },
#     { index = "hakken-pip-registry", marker = "sys_platform == 'linux'" }
# ]
torch = [
  { index = "pytorch-gpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }
]
# torch-geometric = [
#   { index = "pytorch-gpu", marker = "sys_platform == 'linux'" },
#   { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }
# ]
hakken_ml_toolkit = { path = "../hakken_ml_toolkit", editable = true }
pyg-lib = [
  { url = "https://data.pyg.org/whl/torch-2.7.0%2Bcpu/pyg_lib-0.5.0+pt27cpu-cp311-cp311-linux_x86_64.whl", marker = "sys_platform == 'linux'" },
  { url = "https://data.pyg.org/whl/torch-2.7.0%2Bcpu/pyg_lib-0.5.0%2Bpt27-cp311-cp311-macosx_14_0_universal2.whl", marker = "sys_platform == 'darwin'" },
  { url = "https://data.pyg.org/whl/torch-2.7.0%2Bcpu/pyg_lib-0.5.0+pt27cpu-cp311-cp311-linux_x86_64.whl", marker = "sys_platform == 'any'" },
]

[tool.hatch.build.targets.sdist]
include = ["hakken_models"]

[tool.hatch.build.targets.wheel]
include = ["hakken_models"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
# 1. Type-check function bodies even if signatures are missing
check_untyped_defs = true

# 2. Require all functions to have full type annotations
disallow_untyped_defs = true

# 3. Prevent implicit Optional (forces explicit Optional[T])
no_implicit_optional = true

# 4. Show error codes like [arg-type], [return-value], etc.
show_error_codes = true

# 5. Don’t explode on third-party libraries without type stubs
ignore_missing_imports = true

files = [
    "hakken_models/**/*.py"
    ]



[[tool.mypy.overrides]]
module = "torch_geometric.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "evidently.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "hakken_models.core.entities.temporal_kg_data"
ignore_errors = true



[tool.ruff]
line-length = 100
exclude = ["misc/", "misc/**/*"]


extend-exclude = [".md", ".json", "hakken_models/render/plots/temporal_kg.py", "notebooks/benchmark*"]

# Make ruff compatible with black
respect-gitignore = true
force-exclude = true

[tool.ruff.lint]

select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (finds likely bugs)
    "C4",  # flake8-comprehensions
    "RET", # flake8-return (return statement checks)
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "ERA", # erad icate (commented out code)
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "TCH", # type-checking imports
    "TRY", # try-except style
]

ignore = ["PLR0913", "TC001", "TC002", "PLR2004", "TRY003", "PLR0915"]

[tool.ruff.format]

# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

skip-magic-trailing-comma = false
line-ending = "auto"
