[project]
name = "simple-xkgc"
version = "0.2.7"
description = "Hakken Explainer Package"
authors = [{ name = "Pablo Sanchez-Martin", email = "pablo.sanchez2@sony.com" }]
requires-python = ">=3.11, <3.12"
readme = "README.md"
dependencies = [
    "torch>=2.4.0,<3",
    "numpy>=2.2.0, <3",
    "data_processing",
    "hakken_ml_toolkit[aws]",
    "kge",
    "optuna-integration[pytorch-lightning]>=4.5.0"
]

[project.optional-dependencies]
llm = [
    "faiss-cpu>=1.12.0",
    "langchain>=1.0.1",
    "langchain-chroma>=0.2.6",
    "langchain-community>=0.4",
    "langchain-ollama>=0.3.10",
    "ollama>=0.6.0",
    "pysqlite3-binary>=0.5.4; sys_platform == 'linux'",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.22",
    "mkdocstrings[python]>=0.30.1",
]

[dependency-groups]
prebuild = [
    "pytest>=8.2.2,<9",
    "mypy>=1.10.1,<2",
    "ruff>=0.13.1,<0.15",
]
dev = [
    "ipykernel>=6.29.5,<7",
    "types-tqdm>=4.67.0.20250417,<5",
    "pandas-stubs>=2.2.3.250308,<3",
    "types-networkx>=3.4.2.20250507,<4",
]

[tool.uv]
default-groups = [
    "prebuild",
    "dev",
]
index-strategy = "unsafe-best-match"
# find-links = ["https://data.pyg.org/whl/torch-2.7.1+cu118.html"]

environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'", 
    "sys_platform == 'linux'",
]


[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true


[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


[tool.uv.sources]
torch = [
  { index = "pytorch-gpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }
]

nx-cugraph-cu11 = { index = "nvidia" }
data_processing = { workspace = true }
hakken_ml_toolkit = { workspace = true }
kge = { workspace = true }

[tool.hatch.build.targets.sdist]
include = ["hakken_explainer"]

[tool.hatch.build.targets.wheel]
include = ["hakken_explainer"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
files = [
    "hakken_explainer/**/*.py",
    "tests/**/*.py"
]

[[tool.mypy.overrides]]
module = "torch_geometric.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["bokeh", "bokeh.*"]
follow_imports = "skip"

[tool.ruff]
line-length = 100

extend-exclude = [".md", ".json", "misc/"]

# Make ruff compatible with black
respect-gitignore = true
force-exclude = true

[tool.ruff.lint]

select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (finds likely bugs)
    "C4",  # flake8-comprehensions
    "RET", # flake8-return (return statement checks)
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "ERA", # erad icate (commented out code)
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "TCH", # type-checking imports
    "TRY", # try-except style
]

ignore = ["B008", "PLR0913", "RUF007"]

[tool.ruff.format]

# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

skip-magic-trailing-comma = false
line-ending = "auto"

[tool.semantic_release]
commit_parser = "conventional-monorepo"
commit_message = """\
chore(release): simple-xkgc@{version}`

Automatically generated by python-semantic-release
"""
tag_format = "simple-xkgc-v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "simple-xkgc-"

[tool.semantic_release.branches.alpha]
# Matches branches with the prefixes 'feat/', 'fix/', or 'perf/'.
match = "^(feat|fix|perf)/.+"
prerelease = true
prerelease_token = "dev"