[project]
name = "spaice-inference-api"
version = "0.0.8"
description = "This package is a REST wrapper for models"
authors = [{ name = "Chrysa Iliopoulou", email = "chrysa.iliopoulou@sony.com" }]
requires-python = ">=3.10, <3.13"
readme = "README.md"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic-settings>=2.0.3,<3",
    "logfmter>=0.0.8,<0.0.9",
    "uvicorn[standard]>=0.32.0",
    "prometheus-client>=0.18.0,<0.19",
    "dependency-injector>=4.46.0,<5",
]

[dependency-groups]
prebuild = [
    "mypy>=1.5.1,<2",
    "pytest>=8.4.1,<9",
    "mock>=5.1.0,<6",
    "types-six>=1.16.21.9,<2",
    "types-mock>=5.1.0.2,<6",
    "typing-extensions>=4.8.0,<5",
    "ruff>=0.13.1,<0.15",
]

[tool.uv]
default-groups = ["prebuild"]

[tool.hatch.build.targets.sdist]
include = ["spaice_inference_api"]

[tool.hatch.build.targets.wheel]
include = ["spaice_inference_api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
files = ["spaice_inference_api/**/*.py", "tests/**/*.py"]

[tool.ruff]
line-length = 100
extend-exclude = [".md", ".json"]

# Make ruff compatible with black
respect-gitignore = true
force-exclude = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (finds likely bugs)
    "C4",  # flake8-comprehensions
    "RET", # flake8-return (return statement checks)
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "ERA", # erad icate (commented out code)
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "TC",  # type-checking imports
]

[tool.ruff.lint.flake8-type-checking]
quote-annotations = true
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]
runtime-evaluated-decorators = [
    "fastapi.APIRouter.post",
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
    "PLR2004",  # Allow magic values in tests
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

skip-magic-trailing-comma = false
line-ending = "auto"


[tool.semantic_release]
commit_parser = "conventional-monorepo"
commit_message = """\
chore(release): spaice-inference-api@{version}`

Automatically generated by python-semantic-release
"""
tag_format = "spaice-inference-api-v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "spaice-inference-api-"

[tool.semantic_release.branches.alpha]
# Matches branches with the prefixes 'feat/', 'fix/', or 'perf/'.
match = "^(feat|fix|perf)/.+"
prerelease = true
prerelease_token = "dev"