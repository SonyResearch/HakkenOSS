[project]
name = "data_api"
version = "0.1.0"
description = "Data API functionalities"
authors = [{ name = "Miquel Ferrer", email = "miquel.ferrer@sony.com" }]
requires-python = ">=3.11, <3.12"
readme = "README.md"
dependencies = [
    "dependency-injector>=4.48.2",
    "fastapi>=0.103.2",
    "ipython>=8.37.0",
    "loguru>=0.7.3",
    "omegaconf>=2.3.0",
    "pandas>=2.3.3",
    "psycopg[binary]>=3.2.3,<4",
    "spaice-inference-api>=0.0.8",
]

[dependency-groups]
prebuild = [
    "pre-commit>=4.4.0",
    "pytest>=8.2.2,<9",
    "mypy>=1.10.1,<2",
    "ruff>=0.13.0,<0.15 ",
]


[tool.uv]
default-groups = [
    "prebuild",
]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "hakken-pip-registry"
url = "https://your-private-registry.example.com/pypi/simple/"
explicit = true
authenticate = "always"

[tool.uv.sources]
spaice-inference-api = { workspace = true }

[tool.hatch.build.targets.sdist]
include = ["data_api"]

[tool.hatch.build.targets.wheel]
include = ["data_api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
files = [
    "data_api/**/*.py",
    "tests/**/*.py"
]


[tool.ruff]
line-length = 100

extend-exclude = [".md", ".json"]

# Make ruff compatible with black
respect-gitignore = true
force-exclude = true

[tool.ruff.lint]

select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (finds likely bugs)
    "C4",  # flake8-comprehensions
    "RET", # flake8-return (return statement checks)
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "ERA", # erad icate (commented out code)
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "TCH", # type-checking imports
    "TRY", # try-except style
]

ignore = ["B008"]

[tool.ruff.format]

# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

skip-magic-trailing-comma = false
line-ending = "auto"

[tool.semantic_release]
commit_parser = "conventional-monorepo"
commit_message = """\
chore(release): data_api@{version}`

Automatically generated by python-semantic-release
"""
tag_format = "data_api-v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "data_api-"

[tool.semantic_release.branches.alpha]
# Matches branches with the prefixes 'feat/', 'fix/', or 'perf/'.
match = "^(feat|fix|perf)/.+"
prerelease = true
prerelease_token = "dev"