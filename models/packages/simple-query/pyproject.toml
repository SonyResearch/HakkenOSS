[project]
name = "simple-query"
version = "0.2.21"
description = "Simple querying module that assumes only one condition and multiple existing links are given."
authors = [{ name = "Jihun Choi", email = "jihun.a.choi@sony.com" }]
requires-python = ">=3.10,<3.13"
readme = "README.md"
dependencies = [
    "spaice-inference-api>=0.0.8",
    "query-common==0.3.2",
    "requests>=2.32.4,<3.0.0",
    "pydantic-settings>=2.10.1,<3.0.0",
    "dependency-injector>=4.48.1,<5.0.0",
    "backports-strenum>=1.3.1 ; python_full_version < '3.11'",
    "pydantic>=2.11.7,<3.0.0",
    "loguru>=0.7.3",
    "neo4j>=6.0.2",
]
packages = [{ include = "simple_query" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.13.1,<0.15",
    "mypy>=1.16.1,<2",
    "types-requests>=2.32.4.20250611,<3",
    "pytest>=8.4.1,<9",
    "responses>=0.25.7,<0.26",
    "python-dotenv>=1.1.1,<2",
    "pyyaml>=6.0.2,<7",
    "types-pyyaml>=6.0.12.20250516,<7",
]

[tool.uv]

[tool.uv.sources]
spaice-inference-api = { workspace = true }
query-common = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "neo4j: marks tests which use real neo4j connection (deselected by default)",
    "link_predictor_api: marks tests which use real link predictor API connection (deselected by default)"
]
addopts = [
    "-m not neo4j and not link_predictor_api",
    "--import-mode=importlib",
]

[tool.mypy]
plugins = "pydantic.mypy"
warn_return_any = true
warn_unused_configs = true
disable_error_code = ["union-attr", "misc"]
files = [
    "simple_query/**/*.py",
    "tests/**/*.py"
]
explicit_package_bases = true

[[tool.mypy.overrides]]
# Suppress mypy errors until Neo4j supports it
module = "neo4j.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
extend-exclude = [".md", ".json"]

# Make ruff compatible with black
respect-gitignore = true
force-exclude = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (finds likely bugs)
    "C4",  # flake8-comprehensions
    "RET", # flake8-return (return statement checks)
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "ERA", # erad icate (commented out code)
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "TC",  # type-checking imports
]

[tool.ruff.lint.flake8-type-checking]
quote-annotations = true
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]
runtime-evaluated-decorators = [
    "fastapi.APIRouter.post",
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
    "PLR2004",  # Allow magic values in tests
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

skip-magic-trailing-comma = false
line-ending = "auto"

[tool.semantic_release]
commit_parser = "conventional-monorepo"
commit_message = """\
chore(release): simple-query@{version}`

Automatically generated by python-semantic-release
"""
tag_format = "simple-query-v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "simple-query-"

[tool.semantic_release.branches.alpha]
# Matches branches with the prefixes 'feat/', 'fix/', or 'perf/'.
match = "^(feat|fix|perf)/.+"
prerelease = true
prerelease_token = "dev"