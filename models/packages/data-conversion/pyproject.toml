[project]
name = "data_conversion"
version = "0.0.3"
description = "Library functions for transforming data from one structure or file format to another."
authors = [{ name = "Sony AI Spaice Team", email = "sonyai-pj-spaice@sony.com" }]
requires-python = ">=3.11,<3.12"
readme = "README.md"
dependencies = [
    "numpy>=2.2.0,<3",
    "pandas>=2.1.0,<3",
    "tqdm>=4.64.1,<5",
    "networkx~=3.1",
    "torch_geometric>=2.3.1,<3",
    "torch",
    "torchvision",
    "torchaudio",
    "pandas-stubs>=2.3.3.260113",
    "types-tqdm>=4.67.3.20260408",
]

[dependency-groups]
prebuild = [
    "parameterized>=0.9.0,<0.10",
    "pytest>=8.3.3,<9",
    "mypy>=1.6.1,<2",
    "ruff>=0.13.1,<0.15",
]

[tool.uv]
default-groups = ["prebuild"]

[[tool.uv.index]]
name = "torch_cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
torch = [{ index = "torch_cpu", marker = "sys_platform == '!=darwin'" }]
torchvision = [{ index = "torch_cpu", marker = "sys_platform == '!=darwin'" }]
torchaudio = [{ index = "torch_cpu", marker = "sys_platform == '!=darwin'" }]

[tool.hatch.build.targets.sdist]
include = ["data_conversion"]

[tool.hatch.build.targets.wheel]
include = ["data_conversion"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
files = ["data_conversion/**/*.py", "tests/**/*.py"]

[[tool.mypy.overrides]]
module = [
    "networkx",
    "torch_geometric.*",
    "parameterized"
]
ignore_missing_imports = true

[tool.isort]
profile = "black"

[tool.black]
line_length = 100
extend_skip = [".md", ".json"]
multi_line_output=3
force_grid_wrap = 0

[tool.ruff]
line-length = 100

extend-exclude = [".md", ".json", "playground/**"]

# Make ruff compatible with black
respect-gitignore = true
force-exclude = true

[tool.ruff.lint]

select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (finds likely bugs)
    "C4",  # flake8-comprehensions
    "RET", # flake8-return (return statement checks)
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "ERA", # erad icate (commented out code)
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "TCH", # type-checking imports
    "TRY", # try-except style
]

ignore = ["B008", "PLR2004", "PLR0913", "TC002"]

[tool.ruff.format]

# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

skip-magic-trailing-comma = false
line-ending = "auto"


[tool.semantic_release]
commit_parser = "conventional-monorepo"
commit_message = """\
chore(release): data_conversion@{version}`

Automatically generated by python-semantic-release
"""
tag_format = "data_conversion-v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "data_conversion-"

[tool.semantic_release.branches.alpha]
# Matches branches with the prefixes 'feat/', 'fix/', or 'perf/'.
match = "^(feat|fix|perf)/.+"
prerelease = true
prerelease_token = "dev"
