[project]
name = "hakken_ml_toolkit"
version = "0.2.9"
description = "Hakken ML Toolkit"
authors = [{ name = "Pablo Sanchez-Martin", email = "pablo.sanchez2@sony.com" },     { name = "Jesus de la Fuente Cedeño", email = "jesus.delafuente@sony.com" },
]
requires-python = ">=3.11, <3.12"
readme = "README.md"
dependencies = [
    "pydantic>=2.8.2,<3",
    "torch>=2.4.0,<3",
    "lightning>=2.4.0,<3",
    "numpy>=2.2.0, <3",
    "loguru>=0.7.3",
    "torchmetrics>=1.4.1,<2",
    "pydantic>=2.8.2,<3",
    "pydantic-settings>=2.8.0,<3",
    "torcheval>=0.0.7,<0.0.8",
    "torchaudio>=2.6.0,<3",
    "omegaconf>=2.3.0,<3",
    "pandas>=2.2.2,<3",
    "strenum>=0.4.15,<0.5",
    "hydra-core>=1.3.2,<2"
]


[dependency-groups]
prebuild = ["pytest>=8.2.2,<9", "mypy>=1.10.1,<2", "ruff>=0.13.1,<0.15"]

dev = [
    "ipykernel>=6.29.5,<7",
    "networkx-stubs>=0.0.1,<0.0.2",
    "pandas-stubs>=2.3.2.250827",
    "types-pyyaml>=6.0.12.20240808,<7",
    "types-networkx>=3.4.2.20250319,<4",
    "boto3-stubs>=1.37.3,<2",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.20",
    "mkdocstrings[python]>=0.30.0",
]


[tool.uv]
default-groups = [
    "prebuild",
    "dev",
    "docs"
]
index-strategy = "unsafe-best-match"

environments = [
    "sys_platform == 'darwin'", # and platform_machine == 'arm64'",
    "sys_platform == 'linux'", # and platform_machine == 'x86_64'"
    "sys_platform == 'any'", # and platform_machine == 'x86_64'"
]

[project.optional-dependencies]
aws = ["boto3>=1.34,<2"]
tracker = ["mlflow>=2.15.1,<3", "wandb>=0.18.3,<0.19"]


[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "hakken-pip-registry"
url = "https://your-private-registry.example.com/pypi/simple/"
explicit = true
authenticate = "always"


[tool.uv.sources]
torch = [
  { index = "pytorch-gpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }
]
torchaudio = [
  { index = "pytorch-gpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }
]
hakken_ml_toolkit = { index = "hakken-pip-registry", marker = "sys_platform == 'any' or sys_platform == 'darwin' or sys_platform == 'linux'" }

[tool.hatch.build.targets.sdist]
include = ["hakken_ml_toolkit"]

[tool.hatch.build.targets.wheel]
include = ["hakken_ml_toolkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
files = [
    "hakken_ml_toolkit/**/*.py",
    "tests/**/*.py"
]

[[tool.mypy.overrides]]
module = ["mlflow", "mlflow.*", "wandb"]
ignore_missing_imports = true


[tool.ruff]
line-length = 100

extend-exclude = [".md", ".json"]

# Make ruff compatible with black
respect-gitignore = true
force-exclude = true

[tool.ruff.lint]

select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (finds likely bugs)
    "C4",  # flake8-comprehensions
    "RET", # flake8-return (return statement checks)
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "ERA", # erad icate (commented out code)
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "TCH", # type-checking imports
    "TRY", # try-except style
]

ignore = ["B008", "PLR2004"]

[tool.ruff.format]

# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

skip-magic-trailing-comma = false
line-ending = "auto"

[tool.semantic_release]
commit_parser = "conventional-monorepo"
commit_message = """\
chore(release): hakken-ml-toolkit@{version}`

Automatically generated by python-semantic-release
"""
tag_format = "hakken-ml-toolkit-v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "hakken-ml-toolkit-"

[tool.semantic_release.branches.alpha]
# Matches branches with the prefixes 'feat/', 'fix/', or 'perf/'.
match = "^(feat|fix|perf)/.+"
prerelease = true
prerelease_token = "dev"