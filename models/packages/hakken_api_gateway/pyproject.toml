[project]
name = "hakken-api-gateway"
version = "0.1.0"
description = "API Gateway for Hakken Biomedical Applications"
authors = [{ name = "Miquel Ferrer", email = "miquel.ferrer@sony.com" }]
requires-python = ">=3.11, <3.12"
readme = "README.md"

dependencies = [
    "dotenv==0.9.9",
    "dependency-injector>=4.48.2",
    "fastapi>=0.103.2",
    "fastapi-cache2==0.2.2",
    "httpx>=0.28.1",
    "jose>=1.0.0",
    "ipython>=8.37.0",
    "loguru>=0.7.3",
    "omegaconf>=2.3.0",
    "pandas>=2.3.3",
    "psycopg[binary]>=3.2.3,<4",
    "pyjwt[crypto]>=2.7",
    "slowapi==0.1.9",
    "spaice-inference-api==0.0.8",
    "respx>=0.22.0",
    "motor>=3.7.1",
    "httptools>=0.7.1",
]

[dependency-groups]
prebuild = [
    "pytest>=8.2.2,<9",
    "mypy>=1.10.1,<2",
    "ruff>=0.13.1,<0.15",
]

dev = ["ipykernel>=6.29.5,<7"]

[tool.uv]
default-groups = [
    "prebuild",
    "dev",
]

[[tool.uv.index]]
name = "hakken-pip-registry"
url = "https://your-private-registry.example.com/pypi/simple/"
explicit = true
authenticate = "always"

[tool.uv.sources]
spaice-inference-api = { workspace = true }

[tool.hatch.build.targets.sdist]
include = ["hakken-api-gateway"]

[tool.hatch.build.targets.wheel]
include = ["hakken-api-gateway"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
files = [
    "hakken_api_gateway/**/*.py",
    "tests/**/*.py"
]


# Ruff
[tool.ruff]
line-length = 100
extend-exclude = [".md", ".json"]
target-version = "py311"

# Make ruff compatible with black
respect-gitignore = true
force-exclude = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (finds likely bugs)
    "C4",  # flake8-comprehensions
    "RET", # flake8-return (return statement checks)
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "ERA", # erad icate (commented out code)
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "TC",  # type-checking imports
] 

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.flake8-type-checking]
quote-annotations = true
exempt-modules = ["typing", "typing_extensions"]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]
runtime-evaluated-decorators = [
    "fastapi.APIRouter.post",
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
    "PLR2004",  # Allow magic values in tests
]

[tool.ruff.lint.isort]
# Ensure imports are separated by type (standard lib, third party, first party)
combine-as-imports = true

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

skip-magic-trailing-comma = false
line-ending = "auto"

[tool.semantic_release]
commit_parser = "conventional-monorepo"
commit_message = """\
chore(release): hakken-api-gateway@{version}`

Automatically generated by python-semantic-release
"""
tag_format = "hakken-api-gateway-v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "hakken-api-gateway-"

[tool.semantic_release.branches.alpha]
# Matches branches with the prefixes 'feat/', 'fix/', or 'perf/'.
match = "^(feat|fix|perf)/.+"
prerelease = true
prerelease_token = "dev"